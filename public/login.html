<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Deceit Hub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card-gaming">
      
      <div class="login-brand">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-dragon"></i>
        </div>
        <h1>Deceit Server</h1>
        <p>لوحة التحكم وقاعدة البيانات المركزية</p>
      </div>

      <div id="loginAlert" style="display: none; padding: 12px 16px; margin-bottom: 24px; border-radius: var(--radius-md); font-size: 13px; background: rgba(244, 63, 94, 0.2); color: #fca5a5; border: 1px solid rgba(244, 63, 94, 0.4); text-align: center;">
      </div>

      <form id="loginForm">
        <div class="form-field">
          <label for="username"><i class="fa-solid fa-user-shield" style="color: var(--gold-primary); margin-left: 6px;"></i> اسم المستخدم / البريد الإلكتروني</label>
          <input type="text" id="username" class="form-control-gaming" placeholder="أدخل اسم المشرف..." required autofocus>
        </div>

        <div class="form-field">
          <label for="password"><i class="fa-solid fa-key" style="color: var(--accent-cyan); margin-left: 6px;"></i> كلمة المرور</label>
          <input type="password" id="password" class="form-control-gaming" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-gaming btn-gold" style="width: 100%; margin-top: 12px;">
          <span>دخول النظام</span>
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </form>

    </div>
  </div>

  <script src="js/particles.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
